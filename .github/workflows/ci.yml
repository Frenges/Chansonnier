name: Build & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      run: npm ci

    - name: Build SvelteKit
      run: npm run build

    - name: Generate asset-list
      run: node scripts/generate-asset-list.js

    - name: Generate asset-map
      run: node scripts/generate-asset-map.js

    - name: Validate asset-map (filesystem)
      run: node scripts/validate-asset-map.js

    - name: Start static server
      run: |
        npm install -g http-server
        http-server build -p 5173 &
        sleep 3

    - name: Validate assets (HTTP)
      env:
        VALIDATE_BASE: "http://localhost:5173"
      run: node scripts/validate-assets.js build/asset-list.json

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: build
